# Builds self-contained Editor binaries for every supported platform and publishes them as a
# GitHub Release, triggered by pushing a version tag (e.g. `v1.0-preview`, `v1.2.3`).
#
# Jobs: test (build the solution + run the unit tests) -> build (publish per runtime) -> release.

name: Release

"on":
  push:
    tags:
      - 'v*'

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Zenith.sln

      - name: Build solution
        run: dotnet build Zenith.sln --configuration Release --no-restore

      - name: Test (Runtime)
        run: dotnet test Zenith.Runtime.Test/Zenith.Runtime.Test.csproj --configuration Release --no-build

      - name: Test (Editor)
        run: dotnet test Zenith.Editor.Test/Zenith.Editor.Test.csproj --configuration Release --no-build

  build:
    name: Publish (${{ matrix.runtime }})
    needs: test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, linux-x64, linux-arm64, osx-x64, osx-arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (${{ matrix.runtime }})
        run: >
          dotnet publish ./Zenith.Editor/Zenith.Editor.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          --output ./publish/${{ matrix.runtime }}/Zenith

      # macOS ships as a real Zenith.app bundle, not a bare folder. Not code-signed/notarized:
      # Gatekeeper still warns "unidentified developer" until the user right-clicks Open.
      - name: Bundle macOS .app (${{ matrix.runtime }})
        if: startsWith(matrix.runtime, 'osx-')
        run: |
          set -e
          # NOTE: Zenith.Editor.csproj still sets <AssemblyName>Prowl.Editor</AssemblyName> (the rebrand
          # renamed projects/folders but not assemblies, ScriptCompiler.cs and the analyzer metadata
          # still key off the Prowl.* assembly names), so the entry executable keeps that name.
          EXE="Prowl.Editor"
          PUB="./publish/${{ matrix.runtime }}/Zenith"
          APP="./publish/${{ matrix.runtime }}/Zenith.app"
          mkdir -p "$APP/Contents/MacOS"
          mv "$PUB"/* "$APP/Contents/MacOS/"
          rmdir "$PUB"
          chmod +x "$APP/Contents/MacOS/$EXE"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key><string>Zenith</string>
              <key>CFBundleDisplayName</key><string>Zenith Editor</string>
              <key>CFBundleExecutable</key><string>$EXE</string>
              <key>CFBundleIdentifier</key><string>com.zenithengine.editor</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
              <key>CFBundleVersion</key><string>${{ github.ref_name }}</string>
              <key>CFBundleShortVersionString</key><string>${{ github.ref_name }}</string>
              <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

      - name: Zip
        run: |
          cd ./publish/${{ matrix.runtime }}
          if [ -d "Zenith.app" ]; then
            zip -r "../../Zenith-${{ github.ref_name }}-${{ matrix.runtime }}.zip" Zenith.app
          else
            zip -r "../../Zenith-${{ github.ref_name }}-${{ matrix.runtime }}.zip" Zenith
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zenith-${{ matrix.runtime }}
          path: Zenith-${{ github.ref_name }}-${{ matrix.runtime }}.zip
          retention-days: 5

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'preview') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
