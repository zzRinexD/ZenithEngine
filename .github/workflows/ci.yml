# Builds the solution and runs the unit tests on every push to main and every pull request.
# This is the quality gate: nothing merges with a red build or failing tests.

name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Zenith.sln

      - name: Build solution
        run: dotnet build Zenith.sln --configuration Debug --no-restore

      - name: Test (Runtime)
        run: dotnet test Zenith.Runtime.Test/Zenith.Runtime.Test.csproj --configuration Debug --no-build

      - name: Test (Editor)
        run: dotnet test Zenith.Editor.Test/Zenith.Editor.Test.csproj --configuration Debug --no-build
